name: Web checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig*.json'
      - '.npmrc'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig*.json'
      - '.npmrc'
      - '.nvmrc'
      - '.node-version'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MONGODB_URI: ''
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@austinkimchi'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: npm test
      - name: Generate Next.js route types
        run: npx --no-install next typegen
      - name: Check TypeScript
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build without production credentials
        run: npm run build
